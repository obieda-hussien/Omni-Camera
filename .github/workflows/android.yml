name: Android release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Verify native quality and benchmark
        run: ./scripts/verify-native.sh
      - name: Configure signing
        env:
          KEYSTORE_B64: ${{ secrets.OMNI_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.OMNI_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OMNI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OMNI_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/omni-signing.jks"
          if [[ -n "$KEYSTORE_B64" ]]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$key_path"
            echo "OMNI_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "OMNI_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "OMNI_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo 'BUILD_SIGNING=production' >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore "$key_path" -storepass android -keypass android \
              -alias omni-development -keyalg RSA -keysize 2048 -validity 3650 \
              -dname 'CN=Omni Camera Development' -noprompt
            echo 'OMNI_STORE_PASSWORD=android' >> "$GITHUB_ENV"
            echo 'OMNI_KEY_ALIAS=omni-development' >> "$GITHUB_ENV"
            echo 'OMNI_KEY_PASSWORD=android' >> "$GITHUB_ENV"
            echo 'BUILD_SIGNING=development' >> "$GITHUB_ENV"
          fi
          echo "OMNI_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"
      - name: Verify and build optimized release
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease bundleRelease --no-daemon --max-workers=4
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Omni-Camera-0.2.0-${{ env.BUILD_SIGNING }}-APK
          path: app/build/outputs/apk/release/*.apk
          compression-level: 9
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Omni-Camera-0.2.0-${{ env.BUILD_SIGNING }}-AAB
          path: app/build/outputs/bundle/release/*.aab
          compression-level: 9
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Omni-Camera-0.2.0-symbols-and-reports
          path: |
            app/build/outputs/mapping/release/
            app/build/outputs/native-debug-symbols/release/
            app/build/reports/
          compression-level: 9
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/omni-signing.jks"

  ui-device:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Build device tests
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --max-workers=2
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: ./scripts/verify-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Omni-Camera-0.2.0-ui-device-checks
          path: |
            ui-screenshots/
            ui-screenshots-runtime.txt
            app/build/reports/androidTests/
          compression-level: 9
